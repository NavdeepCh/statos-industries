<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="referrer" content="strict-origin-when-cross-origin">
  <title>Opening Stratos Internship Portal…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f5f0; color: #171b19; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
    main { max-width: 520px; }
    a { color: #2d3b21; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Opening the Stratos Internship Portal</h1>
    <p>Your internship credential verification is being redirected to the Stratos internship site.</p>
    <p><a id="continue-link" href="https://stratos-internship.vercel.app/">Continue to the internship portal</a></p>
  </main>
  <script>
    const destination = new URL("https://stratos-internship.vercel.app/");
    const query = new URLSearchParams(window.location.search);
    const credentialId = query.get("id");
    if (credentialId) destination.searchParams.set("id", credentialId);
    document.getElementById("continue-link").href = destination.href;
    window.location.replace(destination.href);
  </script>
</body>
</html>
